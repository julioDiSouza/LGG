<div class="container">

    <!-- Logo -->
    <div class="logo-container center">
        <img src="/images/logo_lgg.png"
             class="logo"
             alt="logo_lgg">
             
    </div>

    <!-- Conteúdo -->
    <div class="conteudo">

        <!-- Estado de validação -->
        <div id="validando" style="text-align: center; display: block">

            <h2>Verificando...</h2>

            <div id="status">
                <div class="spinner"></div>
            </div>

        </div>

        <!-- Estado confirmado -->
        <div id="confirmado" style="text-align: center; display: none">

            <h2>Sucesso</h2>

            <p>
                <span class="destaque">
                    &nbsp;<i>Seu cadastro foi confirmado!</i>&nbsp;
                </span>
            </p>

            <p id="orientacao">
                Clique no botão abaixo:
            </p>

            <a href="http://localhost:4200/"
               class="botao">
                Página inicial
            </a>

            <br>

        </div>

        <!-- Estado falhou -->
        <div id="falhou" style="text-align: center; display: none">

            <h2>Pronto</h2>

            <p>
                Clique no botão abaixo:
            </p>

            <a href="http://localhost:4200/"
               class="botao">
                Página inicial
            </a>

            <br>

        </div>

    </div>

</div>
