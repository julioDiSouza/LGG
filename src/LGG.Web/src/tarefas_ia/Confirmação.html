<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #131313;
            color: white;
        }

        .destaque {
            position: relative;
            display: inline-block;
            z-index: 0;
            font-weight: 850;
            font-size: 17pt;
        }

        .destaque::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 5%;
            width: 100%;
            height: 60%;
            background-color: #7506f7;
            z-index: -1;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 500px;
            margin: 0 auto;
        }

        .logo-container {
            width: 500px;
            height: 115px;
        }

        .logo {
            height: 80px;
        }

        h2 {
            color: #44f5fe;
            margin-top: 0;
        }

        #status {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 5px solid #444;
            border-top: 5px solid #44f5fe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #orientacao {
            display: none;
            margin-top: 20px;
        }

        .botao {
            background: #44f5fe;
            padding: 12px 20px;
            border: none;
            color: black;
            border-radius: 20px;
            display: block;
            margin: 20px auto 0;
            width: 60%;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .botao:hover {
            opacity: 0.85;
        }

        #confirmado {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Logo -->
    <div class="logo-container center">
        <img src="logo_lgg.png"
             class="logo"
             alt="logo_lgg">
    </div>

    <!-- Conteúdo -->
    <div class="conteudo">

        <!-- Estado de validação -->
        <div id="validando" style="text-align: center">

            <h2>Verificando...</h2>

            <div id="status">
                <div class="spinner"></div>
            </div>

        </div>

        <!-- Estado confirmado -->
        <div id="confirmado" style="text-align: center">

            <h2>Sucesso</h2>

            <p>
                <span class="destaque">
                    &nbsp;<i>Seu cadastro foi confirmado!</i>&nbsp;
                </span>
            </p>

            <p id="orientacao">
                Clique no botão abaixo:
            </p>

            <a href="https://localhost:7182/"
               class="botao">
                Página inicial
            </a>

            <br>

        </div>

    </div>

</div>

<!-- Biblioteca de confete -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

    let tempo = 3;

    const validando = document.getElementById("validando");
    const confirmado = document.getElementById("confirmado");
    const orientacao = document.getElementById("orientacao");

    const intervalo = setInterval(() => {

        tempo--;

        if (tempo === 0) {

            clearInterval(intervalo);

            // Esconde a tela de validação
            validando.style.display = "none";

            // Exibe a confirmação
            confirmado.style.display = "block";

            // Exibe a orientação
            orientacao.style.display = "block";

            // Dispara o confete
            confetti({
                particleCount: 150,
                spread: 100,
                origin: {
                    y: 0.5
                }
            });

            // Segundo disparo
            setTimeout(() => {

                confetti({
                    particleCount: 100,
                    spread: 120,
                    origin: {
                        y: 0.6
                    }
                });

            }, 300);
        }

    }, 1000);

</script>

</body>
</html>
