# Define a shared memory zone for rate limiting
limit_req_zone $binary_remote_addr zone=one:10m rate=3r/s;

# Listen on port 80 and forward to localhost:8080
server {
	listen 8080;
	server_name linksforyou.com.br;
	root /usr/share/nginx/html;
	index index.html;
	location / {
		limit_req zone=one burst=3 nodelay;
        limit_req_status 429; # HTTP 429 Too Many Requests
		try_files $uri $uri/ /index.html =404;
	}
}

server {
	listen 8080;
	server_name linksforyou.com.br;
	
    location /l/ {
		limit_req zone=one burst=3 nodelay;
        limit_req_status 429; # HTTP 429 Too Many Requests
        proxy_pass http://container-api:1000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}