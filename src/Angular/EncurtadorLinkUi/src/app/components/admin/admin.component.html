<div class="content m-2">
  <h3>Área logada.</h3>
  <br>
  <button (click)="pingApi()" class="btn btn-primary">
    Verificar Api
  </button>
  <br>
  <br>
  <button (click)="autenticado()" class="btn btn-primary">
    Autenticado?
  </button>
  <br>
  <br>
  <button (click)="autenticadoAdmin()" class="btn btn-primary">
    Autenticado Admin?
  </button>
  <br>
  <br>
  <button (click)="encrypt()" class="btn btn-primary">
    Crypto
  </button>
  <br>
  <br>
  <button (click)="logOut()" class="btn btn-danger">
    Log out
  </button>
  <br>
  <br>
  <input [(ngModel)]="_urlLonga"  type="text" placeholder="Url Longa">
  <br>
  <button (click)="encurtar()" class="btn btn-primary">
    Link autenticado
  </button>
  <br>
  <br>
  <input [(ngModel)]="_urlLongaPublica"  type="text" placeholder="Url Longa Publica">
  <br>
  <button (click)="encurtarPublico()" class="btn btn-primary">
    Link Publico
  </button>
</div>
