<div class="container">
  <div class="row">
    <div class="offset-md-2 col-lg-4 col-md-7 offset-lg-4 offset-md-3 centralizado">
      <div class="panel border bg-white">
        <div class="panel-heading" *ngIf="feito">
          <h3 class="pt-3 font-weight-bold">Feito!</h3>
        </div>
        <div class="panel-heading" *ngIf="!feito">
          <h3 class="pt-3 font-weight-bold">Atualização de Senha</h3>
        </div>
        <div class="panel-body p-3">
          <div class="text-center" *ngIf="!valido">
            <p>
              Código inválido.
            </p>
          </div>
          <form [formGroup]="resetPasswordForm" *ngIf="valido && !feito">
            <div class="form-group pt-3">
              <div class="input-field" [class.error]="resetPasswordForm.controls['senha'].dirty && resetPasswordForm.hasError('required','senha')">
                <span class="fa fa-lock p-2"></span>
                <input formControlName="senha" [type]="type" placeholder="Nova senha">
                <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
              </div>
            </div>
            <small *ngIf="resetPasswordForm.controls['senha'].dirty && resetPasswordForm.hasError('required','senha')"  class="text-danger">
              *Nova senha é obrigatória
            </small>
            <div class="text-danger col-12 small" *ngIf="resetPasswordForm.controls['senha'].dirty">
              <span *ngIf="resetPasswordForm.errors?.['validPassWordError']">*A senha deve possuir: </span>
              <span *ngIf="!passwordFormField?.value?.match('^(?=.*[A-Z])')">Letra maiúscula. </span>
              <span *ngIf="!passwordFormField?.value?.match('(?=.*[a-z])')">Letra minuscula. </span>
              <span *ngIf="!passwordFormField?.value?.match('(.*[0-9].*)')">Número. </span>
              <span *ngIf="!passwordFormField?.value?.match('(?=.*[!@#$%^&*])')">Caracter especial. </span>
              <span *ngIf="!passwordFormField?.value?.match('.{8,}')">8 ou mais dígitos.</span>
            </div>
            <div class="form-group pt-3">
              <div class="input-field" [class.error]="resetPasswordForm.controls['reSenha'].dirty && resetPasswordForm.hasError('required','reSenha')">
                <span class="fa fa-lock p-2"></span>
                <input formControlName="reSenha" [type]="type" placeholder="Confirmar nova senha">
                <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
              </div>
            </div>
            <small *ngIf="resetPasswordForm.controls['reSenha'].dirty && resetPasswordForm.hasError('required','reSenha')"  class="text-danger">
              *Confirmar nova senha é obrigatório
            </small>
            <small *ngIf="resetPasswordForm.errors?.['passwordmatcherror']" class="text-danger">
              *Confirmação de senhas não conferem, precisam ser iguais.
            </small>
            <button (click)="onResetConfirm()"  type="submit" class="btn btn-primary btn-block btn-circle mt-4 w-100" [disabled]="isLoading">
              Atualizar
              <span class="spinner-border spinner-border-sm" role="status" *ngIf="isLoading"></span>
            </button>
          </form>
          <div class="pt-4 text-muted mb-4 text-center">
            Clique <span id="forget" class="likelink" (click)="toLogin()">aqui</span> para Logar.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
