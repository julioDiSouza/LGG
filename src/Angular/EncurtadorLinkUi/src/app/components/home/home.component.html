<div class="container">
  <div class="row {{navcolor}}" style="font-weight: 500; font-size: large; padding-top: 15px;">
    <div class="col-2">
      <p>
        <span>
          Olá {{nome}}<span *ngIf="logado">,</span>
        </span> 
      </p>
    </div>
    <div class="col-6"></div>
    <div class="col-4">
      <div class="row">
        <div class="col-5 col-sm-12 col-md-5">
          <span *ngIf="logado">Meus links</span>
        </div>
        <div class="col-4 col-sm-12 col-md-4">
          Sobre
        </div>
        <div class="col-3 col-sm-12 col-md-3">
          <span *ngIf="!logado" (click)="toLogin()" class="pointer">Entrar</span>
          <span *ngIf="logado" (click)="logOut()" class="pointer">Sair</span>
        </div>
      </div>
    </div>
  </div>
  <div class="row centralizado panel-home border bg-white">
    <div class="col-sm-12 col-md-1 col-1"></div>
    <div class="col-sm-12 col-md-5 col-5">
      <div style="padding-top: 120px;">
        <div class="mb-2">
          <div style="margin-bottom: -15px;">
            <div style="margin-bottom: -20px;">
              <img src="../../../assets/images/l4u_logo_main.png" width="45px" height="45px">
            </div>
            <div style="margin-left: 55px;">
              Links for you
            </div>
          </div>
        </div>
        <div style="color: #2C87C5;font-size: 25pt; font-weight: bold; width: 350px;">Encurtador de Links, </div>
        <div style="color: #F2B813; font-size: 20pt; font-weight: bold; margin-top: -12px; padding-left: 25px; width: 350px;">é totalmente &nbsp;</div>
        <div style="color: #32A34F; font-size: 30pt; font-weight: bold; width: 350px; margin-top: -40px; padding-right: 20px; text-align: right;">Grátis!</div>
        <div *ngIf="!logado">
          Para mais opções realize o login clicando <span class="likelink" (click)="toLogin()">aqui.</span>
        </div>
        <div *ngIf="logado">
          <span class="badge rounded-pill text-bg-success">VOCÊ ESTÁ CONECTADO</span>
        </div>
      </div>
    </div>
    <div class="col-sm-12 col-md-5 col-5">
      <div style="padding-top: 150px; padding-bottom: 120px;">
        <form [formGroup]="urlForm">
          <div class="form-group pt-3">
            <div class="input-field">
              <span class="fa fa-hand-o-right p-2"></span>
              <input formControlName="url" type="text" placeholder="Insira aqui seu endereço longo: https://www...">
            </div>
            <small class="text-danger" *ngIf="urlForm.errors?.['urlValidatorError'] && urlForm.controls['url'].dirty && urlForm.controls['url'].value">
              Endereço inválido.
            </small>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-circle mt-4" style="width: 130px;" (click)="onEncurtar()" [disabled]="isLoading" >
            Encurtar
            <span class="spinner-border spinner-border-sm" role="status" *ngIf="isLoading"></span>
          </button>
        </form>
      </div>
    </div>
    <div class="col-sm-12 col-md-1 col-1"></div>
  </div>
</div>
