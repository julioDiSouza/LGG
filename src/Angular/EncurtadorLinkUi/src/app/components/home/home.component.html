<div class="container">
  <app-nav-bar></app-nav-bar>
  <div class="row">
    <div class="col col-1 col-sm-1 col-md-1 col-lg-1"></div>
    <div class="col col-lg-10">
      <div class="row panel-home border bg-white">
        <div class="col col-1 col-sm-1 col-md-1 col-lg-1"></div>
        <div class="col col-lg-5 col-md-11 col-sm-11">
          <div style="padding-top: 120px;">
            <div class="mb-2">
              <div>
                <div>
                  <img src="../../../assets/images/l4u_logo_main.png" width="45px" height="45px">
                </div>
                <div style="margin-left: 55px; margin-top: -15px;">
                  Links for you
                </div>
              </div>
            </div>
            <div style="color: #2C87C5;font-size: 25pt; font-weight: bold; width: 350px;">Encurtador de Links, </div>
            <div
              style="color: #F2B813; font-size: 20pt; font-weight: bold; padding-top: 10px; padding-left: 15px; width: 350px;">
              é totalmente &nbsp;</div>
            <div
              style="color: #32A34F; font-size: 30pt; font-weight: bold; width: 350px; margin-top: -10px; padding-right: 55px; text-align: right;">
              Grátis!</div>
            <div *ngIf="!logado" style="padding-top: 15px;">
              Para mais opções realize o login clicando <span class="likelink" routerLink="/login">aqui</span>
            </div>
          </div>
        </div>
        <div class="col col-1 col-sm-1 col-md-1 col-lg-1"></div>
        <div class="col col-lg-5 col-md-11 col-sm-11">
          <div style="padding-top: 150px; padding-bottom: 120px;" *ngIf="encurtado">
            <div class="row">
              <div class="col col-12">
                <p>
                  Feito! Seu link curto está pronto:
                </p>
                <div style="font-size: larger; font-weight: bold;">
                  {{linkCurto}}
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col col-4">
                <button type="submit" class="btn btn-success btn-block btn-circle" style="width: 130px;"
                  (click)="copiar()" [disabled]="isLoading">
                  Copiar
                  &nbsp;
                  <span class="fa fa-files-o" aria-hidden="true"></span>
                </button>
              </div>
              <div class="col col-8" style="padding-top: 35px;">
                &nbsp;
                <span class="likelink" (click)="novoLink()">novo link</span>
              </div>
            </div>
          </div>
          <div style="padding-top: 150px; padding-bottom: 120px;" *ngIf="!encurtado">
            <div class="row">
              <div class="col col-12">
                <form [formGroup]="urlForm">
                  <div class="form-group pt-3">
                    <div class="input-field col col-11">
                      <span class="fa fa-hand-o-right p-2"></span>
                      <input formControlName="url" type="text"
                        placeholder="Insira aqui seu endereço longo: https://www...">
                    </div>
                    <small class="text-danger"
                      *ngIf="urlForm.errors?.['urlValidatorError'] && urlForm.controls['url'].dirty && urlForm.controls['url'].value">
                      O endereço deve ser válido e começar com http...
                    </small>
                  </div>
                  <button type="submit" class="btn btn-primary btn-block btn-circle mt-4" style="width: 130px;"
                    (click)="onEncurtar()" [disabled]="isLoading">
                    Encurtar
                    <span class="spinner-border spinner-border-sm" role="status" *ngIf="isLoading"></span>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col col-1 col-sm-1 col-md-1 col-lg-1"></div>
  </div>
</div>
