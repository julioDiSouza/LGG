<div class="container" style="padding-top: 58px;">
  <div class="row">
    <div class="offset-md-2 col-lg-4 col-md-7 offset-lg-4 offset-md-3 centralizado">
      <div class="panel border bg-white">
        <div class="panel-heading">
          <h3 class="pt-3 font-weight-bold">Entrar</h3>
        </div>
        <div class="panel-body p-3">
          <form [formGroup]="loginForm">
            <div class="form-group pt-3">
              <div class="input-field"
                [class.error]="loginForm.controls['email'].dirty && loginForm.hasError('required','email')">
                <span class="fa fa-user p-2"></span>
                <input formControlName="email" type="email" placeholder="Email" [(ngModel)]="inputEmail" (ngModelChange)="checkValidLoginEmail($event)">
              </div>
            </div>
            <small *ngIf="loginForm.controls['email'].dirty && loginForm.hasError('required','email')" class="text-danger">
              *Email é obrigatório
            </small>
            <small *ngIf="!isValidLoginEmail && inputEmail" class="text-danger">*Email é inválido</small>
            <div class="form-group pt-3">
              <div class="input-field"
                [class.error]="loginForm.controls['senha'].dirty && loginForm.hasError('required','senha')">
                <span class="fa fa-lock p-2"></span>
                <input formControlName="senha" [type]="type" placeholder="Senha">
                <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
              </div>
            </div>
            <small *ngIf="loginForm.controls['senha'].dirty && loginForm.hasError('required','senha')"
              class="text-danger">
              *Senha é obrigatória
            </small>
            <div class="form-inline fr mt-4">
              <a id="forgot" class="font-weight-bold" data-bs-toggle="modal" data-bs-target="#exampleModal">Esqueci a senha</a>
            </div>
            <button (click)="onLogin()" type="submit" class="btn btn-circle btn-primary btn-block mt-4 w-100" [disabled]="isLoadingEntrar">
              Entrar
              <span class="spinner-border spinner-border-sm" role="status" *ngIf="isLoadingEntrar"></span>
            </button>
            <div class="text-center pt-4 text-muted">Não tem uma conta? <a id="signup" routerLink="/signup">Cadastre-se</a></div>
          </form>
        </div>
        <div class="mx-3 my-2 py-2 border-t">
          <div class="py-3 row">
            <div class="col-4"></div>
            <div class="col-2">
              <span (click)="onFacebookLogin()">
                <img class="img-circle" src="../../../assets/images/facebook-login-logo.png" style="width: 38px; height: 38px; cursor: pointer;">
              </span>
            </div>
            <div class="col-2 px-3">
              <div  style="height: 15px; position: absolute;"><img class="pointer" src="../../../assets/images/google_btn_logo.png"></div>
              <div class="img-circle" id="buttonGoogle" style="height: 15px; opacity: 0;"></div>
            </div>
            <div class="col-4"></div>
          </div>
        </div>
        <div class="text-center text-muted mb-2" style="margin-top: -15px;"><a id="signup" routerLink="/">Ir à página inicial</a></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <p class="modal-title" id="exampleModalLabel">
          <span style="font-size: 25px; font-weight:700">
            Esqueceu a senha?
          </span>
          <br>
          <small>
            Por favor, insira seu e-mail para receber o link de renovação.
          </small>
        </p>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div class="form-group pt-3">
          <div class="input-field">
            <span class="fa fa-user p-2"></span>
            <input [(ngModel)]="resetPasswordEmail" (ngModelChange)="checkValidEmail($event)" type="text"
              placeholder="Email">
          </div>
          <small *ngIf="!resetPasswordEmail && clicado" class="text-danger">*Email é obrigatório</small>
          <small *ngIf="!isValidEmail && resetPasswordEmail" class="text-danger">*Email é inválido</small>
        </div>
      </div>

      <div class="modal-footer">
        <button id="closeBtn" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <button class="btn btn-primary" (click)="confirmToSend()" [disabled]="clicadoEnviar">
          Enviar
          <span class="spinner-border spinner-border-sm" role="status" *ngIf="clicadoEnviar"></span>
        </button>
      </div>

    </div>
  </div>
</div>
