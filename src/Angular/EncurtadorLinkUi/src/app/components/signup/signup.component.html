<div class="container">
  <div class="row">
    <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3 centralizado">
      <div class="panel border bg-white">
        <div class="panel-heading">
          <h3 class="pt-3 font-weight-bold">Cadastro</h3>
        </div>
        <div class="panel-body p-3">
          <form [formGroup]="signUpForm">
            <div class="form-group pt-3">
              <div class="input-field" [class.error]="signUpForm.controls['nomeCompleto'].dirty && signUpForm.hasError('required','nomeCompleto')">
                <span class="fa fa-user p-2"></span>
                <input formControlName="nomeCompleto" type="text" placeholder="Nome Completo">
              </div>
            </div>
            <small *ngIf="signUpForm.controls['nomeCompleto'].dirty && signUpForm.hasError('required','nomeCompleto')"  class="text-danger">
              *Nome Completo é obrigatório
            </small>
            <div class="form-group pt-3">
              <div class="input-field" [class.error]="signUpForm.controls['email'].dirty && signUpForm.hasError('required','email')">
                <span class="fa fa-user p-2"></span>
                <input formControlName="email" type="email" placeholder="Email">
              </div>
            </div>
            <small *ngIf="signUpForm.controls['email'].dirty && signUpForm.hasError('required','email')"  class="text-danger">
              *Email é obrigatório
            </small>
            <div class="form-group pt-3">
              <div class="input-field" [class.error]="signUpForm.controls['senha'].dirty && signUpForm.hasError('required','senha')">
                <span class="fa fa-lock p-2"></span>
                <input formControlName="senha" [type]="type" placeholder="Senha">
                <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
              </div>
            </div>
            <small *ngIf="signUpForm.controls['senha'].dirty && signUpForm.hasError('required','senha')"  class="text-danger">
              *Senha é obrigatória
            </small>
            <div class="form-group pt-3">
              <div class="input-field" [class.error]="signUpForm.controls['reSenha'].dirty && signUpForm.hasError('required','reSenha')">
                <span class="fa fa-lock p-2"></span>
                <input formControlName="reSenha" [type]="type" placeholder="Confirmar Senha">
                <span (click)="hideShowPass()" class="{{eyeIcon}}"></span>
              </div>
            </div>
            <small *ngIf="signUpForm.controls['reSenha'].dirty && signUpForm.hasError('required','reSenha')"  class="text-danger">
              *Confirmar Senha é obrigatório
            </small>
            <button (click)="onSignUp()" type="submit" class="btn btn-primary btn-block mt-4 w-100">Criar</button>
            <div class="text-center pt-4 text-muted mb-4">
              Já possui uma conta? <a id="forget" routerLink="/login">Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
